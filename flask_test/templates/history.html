{% extends "layout.html" %}
{% block content %}
    <table border="1">
        <tr>
            <th>Title</th>
            <th>Content</th>
        </tr>
        {% for line in lines %}
        <tr>
            <td>{{ line.split(',')[0] }}</td>
            <td>{{ line.split(',')[1] }}</td>
        </tr>
        {% endfor %}
    </table><br>

    <form action="/">
        <button type="submit">Go Back</button>
    </form>
{% endblock %}
